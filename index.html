<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>5月GMV目标达成率追踪</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei",sans-serif;background:#f0f2f5;padding:20px;color:#333}
.header{text-align:center;margin-bottom:20px}
.header h1{font-size:26px;color:#1a1a1a}
.header .date{color:#888;font-size:13px;margin-top:5px}
.drop-zone{border:3px dashed #bbb;border-radius:12px;padding:35px;text-align:center;margin-bottom:20px;background:#fafafa;transition:all .3s;cursor:pointer}
.drop-zone.dragover{border-color:#5470c6;background:#eef2ff;transform:scale(1.01)}
.drop-zone p{font-size:16px;color:#555}
.drop-zone .hint{font-size:12px;color:#999;margin-top:8px}
.toolbar{display:flex;gap:10px;margin-bottom:18px;align-items:center;flex-wrap:wrap}
.toolbar button{padding:8px 16px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-family:inherit;transition:background .2s}
.btn-danger{background:#ff4d4f;color:#fff}.btn-danger:hover{background:#ff7875}
.btn-info{background:#5470c6;color:#fff}.btn-info:hover{background:#7b9bd6}
.history-info{font-size:13px;color:#666}
.city-section{background:#fff;border-radius:12px;padding:24px;margin-bottom:24px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.city-title{font-size:22px;font-weight:bold;color:#1a1a1a;margin-bottom:8px;border-left:4px solid #5470c6;padding-left:12px}
.kpi-row{display:flex;gap:12px;margin:15px 0;flex-wrap:wrap}
.kpi-card{flex:1;min-width:130px;border-radius:10px;padding:20px;text-align:center;color:#fff}
.kpi-card .label{font-size:16px;opacity:1;font-weight:600}
.kpi-card .value{font-size:34px;font-weight:bold;margin-top:8px}
.kpi-purple{background:linear-gradient(135deg,#667eea,#764ba2)}
.kpi-green{background:linear-gradient(135deg,#11998e,#38ef7d)}
.kpi-orange{background:linear-gradient(135deg,#f093fb,#f5576c)}
.kpi-blue{background:linear-gradient(135deg,#4facfe,#00f2fe)}
.chart-box{height:580px;margin-top:10px}
.path-section{margin-top:20px}
.path-section h3{font-size:16px;margin-bottom:12px;color:#444}
.summary-table{width:auto;border-collapse:collapse;margin-bottom:18px;font-size:13px;table-layout:auto}
.summary-table th{background:#f5f7fa;padding:10px 12px;text-align:center;border:1px solid #e8e8e8;font-weight:600;color:#333;white-space:nowrap}
.summary-table td{padding:9px 12px;text-align:center;border:1px solid #e8e8e8;white-space:nowrap}
.summary-table tr:hover td{background:#fafbfc}
.rate-good{color:#52c41a;font-weight:bold}
.rate-warn{color:#faad14;font-weight:bold}
.rate-bad{color:#ff4d4f;font-weight:bold}
.path-charts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(480px,1fr));gap:16px}
.path-chart-item{height:360px;background:#fafbfc;border-radius:8px;border:1px solid #eee}
.path-block{background:#fafbfc;border-radius:10px;padding:18px 20px;margin:16px 0;border:1px solid #eee}
.block-title{font-size:17px;font-weight:bold;color:#1a1a1a;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid #e8e8e8}
.toast{position:fixed;top:20px;right:20px;padding:12px 20px;border-radius:8px;color:#fff;font-size:14px;z-index:9999;opacity:0;transition:opacity .3s}
.toast.show{opacity:1}.toast.success{background:#52c41a}.toast.error{background:#ff4d4f}.toast.info{background:#1890ff}
.note{text-align:center;color:#999;font-size:12px;margin-top:24px}
.tab-bar{display:flex;gap:0;margin-bottom:20px;border-bottom:2px solid #e8e8e8}
.tab-btn{padding:10px 28px;border:none;background:none;cursor:pointer;font-size:15px;font-family:inherit;color:#666;border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .2s}
.tab-btn:hover{color:#5470c6}
.tab-btn.active{color:#5470c6;font-weight:bold;border-bottom-color:#5470c6}
.tab-content{display:none}
.tab-content.active{display:block}
.analysis-box{background:#f8faff;border-left:4px solid #5470c6;border-radius:0 8px 8px 0;padding:14px 18px;margin:12px 0 18px 0;font-size:13px;line-height:1.8;color:#444}
.analysis-box .analysis-title{font-weight:bold;color:#333;margin-bottom:6px;font-size:14px}
.analysis-box .highlight-good{color:#52c41a;font-weight:bold}
.analysis-box .highlight-warn{color:#faad14;font-weight:bold}
.analysis-box .highlight-bad{color:#ff4d4f;font-weight:bold}
.analysis-box .highlight-info{color:#5470c6;font-weight:bold}
.analysis-box ul{margin:4px 0 0 18px;padding:0}
.analysis-box li{margin-bottom:2px}
.path-analysis-box{background:#fffbe6;border-left:4px solid #faad14;border-radius:0 8px 8px 0;padding:10px 14px;margin:8px 0 14px 0;font-size:12px;line-height:1.7;color:#555}
</style>
</head>
<body>
<div class="header">
  <h1>📊 5月GMV目标达成率追踪</h1>
  <div class="date" id="reportDate"></div>
</div>
<div class="drop-zone" id="dropZone">
  <p>📂 将Excel文件拖拽到此处，或点击选择文件</p>
  <div class="hint">支持 5月目标达成模板.xlsx（自动读取"达成率看板"sheet）| 天气数据请用工具栏按钮单独上传</div>
  <input type="file" id="fileInput" accept=".xlsx,.xls" style="display:none">
</div>
<div class="toolbar">
  <span class="history-info" id="historyInfo">暂无历史数据</span>
  <button class="btn-info" onclick="uploadWeather()">🌤️ 上传天气数据</button>
  <input type="file" id="weatherInput" accept=".xlsx,.xls" style="display:none">
  <span class="history-info" id="weatherInfo" style="color:#faad14"></span>
  <button class="btn-info" onclick="exportCSV()">📥 导出CSV</button>
  <button class="btn-info" onclick="downloadHTML()" style="background:#13c2c2">📄 下载当前页面</button>
  <button class="btn-danger" onclick="clearHistory()">🗑️ 清空历史</button>
  <button class="btn-danger" onclick="clearWeather()" style="background:#faad14">🌤️ 清空天气</button>
</div>
<div class="tab-bar" id="tabBar">
  <button class="tab-btn active" data-tab="overview" onclick="switchTab('overview')">总览</button>
  <button class="tab-btn" data-tab="武汉" onclick="switchTab('武汉')">武汉</button>
  <button class="tab-btn" data-tab="长沙" onclick="switchTab('长沙')">长沙</button>
  <button class="tab-btn" data-tab="合肥" onclick="switchTab('合肥')">合肥</button>
</div>
<div id="tab-overview" class="tab-content active"></div>
<div id="tab-武汉" class="tab-content"></div>
<div id="tab-长沙" class="tab-content"></div>
<div id="tab-合肥" class="tab-content"></div>
<div class="note">拖入Excel自动解析 | 数据保存在浏览器本地存储</div>
<div class="toast" id="toast"></div>

<script>
// ========== 常量 ==========
var MAY_DAYS = 31; // 默认值，会被数据自动覆盖
var DATA_YEAR = 2026; // 默认年份，会被数据自动覆盖
var DATA_MONTH = 5; // 默认月份，会被数据自动覆盖
var STORAGE_KEY = 'gmv_may_history_v2';

// 根据数据自动检测月份和天数
function detectMonthFromData(history) {
  var allDates = [];
  ['武汉', '长沙', '合肥', '合计'].forEach(function(city) {
    if (history[city]) {
      Object.keys(history[city]).forEach(function(d) { allDates.push(d); });
    }
  });
  if (allDates.length === 0) return;
  allDates.sort();
  // 取第一个日期来确定年月，格式 "2026-05-01"
  var firstDate = allDates[0];
  var match = firstDate.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!match) return;
  DATA_YEAR = parseInt(match[1]);
  DATA_MONTH = parseInt(match[2]);
  // 计算该月有多少天
  MAY_DAYS = new Date(DATA_YEAR, DATA_MONTH, 0).getDate();
}

// 生成当月所有日期的数组
function generateAllDates() {
  var allDates = [];
  var prefix = DATA_YEAR + '-' + String(DATA_MONTH).padStart(2, '0') + '-';
  for (var dy = 1; dy <= MAY_DAYS; dy++) {
    allDates.push(prefix + String(dy).padStart(2, '0'));
  }
  return allDates;
}

// 节假日/休息日配置（法定假日手动配置，周末自动计算）
var HOLIDAYS_MANUAL = {
  // 4月: 清明节4/4-6（4/4六、4/5日本身是周末，4/6一调休）
  4: { 6: '清明节' },
  // 5月: 五一5/1-5（5/1四~5/5一）
  5: { 1: '五一', 4: '五一', 5: '五一' },
  // 6月: 端午节（待确认具体日期）
  6: {}
};
function getHolidays() {
  var manual = HOLIDAYS_MANUAL[DATA_MONTH] || {};
  var result = {};
  // 自动计算当月所有周末（周六、周日）
  for (var d = 1; d <= MAY_DAYS; d++) {
    var date = new Date(DATA_YEAR, DATA_MONTH - 1, d);
    var dow = date.getDay(); // 0=周日, 6=周六
    if (dow === 0 || dow === 6) {
      result[d] = '周末';
    }
  }
  // 手动配置的假日覆盖（优先级更高）
  Object.keys(manual).forEach(function(k) { result[k] = manual[k]; });
  return result;
}
function isHoliday(day) { return getHolidays()[day] != null; }
function holidayLabel(day) { return getHolidays()[day] || ''; }

var CITIES = ['武汉', '长沙', '合肥'];

// 达成率看板中每个城市的数据区域（行号，1-indexed）
var CITY_SECTION = {
  '武汉': { headerRow: 89, dataStart: 90, dataEnd: 119 },
  '长沙': { headerRow: 123, dataStart: 124, dataEnd: 153 },
  '合肥': { headerRow: 157, dataStart: 158, dataEnd: 187 },
  '合计': { headerRow: 191, dataStart: 192, dataEnd: 221 }
};

// 达成率看板列映射（0-indexed from header row）
// 每个渠道占3列：累计值, 目标, 完成率
// Col layout (0-indexed):
// 0:日期, 1:时间进度
// 2-4: 端内[站点], 5-7: 五一地推, 8-10: 周末地推, 11-13: 站点合计
// 14-16: 端内[门店], 17-19: 上翻, 20-22: 门店合计
// 23-25: 渠道拓展合计
// 26-28: 美团有人门店, 29-31: 美团无人点位, 32-34: 新开门店, 35-37: 抖音, 38-40: 美团抖音合计
// 41-43: 闲鱼, 44-46: 小红书, 47-49: 新媒体合计
// 50-52: 续租, 53-55: 现有的分销人, 56-58: 私域推广, 59-61: 私域合计

var CHANNEL_COLS = {
  '端内':       { col: 2 },
  '五一地推':   { col: 5 },
  '周末地推':   { col: 8 },
  '站点合计':   { col: 11 },
  '门店端内':   { col: 14 },
  '上翻':       { col: 17 },
  '门店合计':   { col: 20 },
  '渠道拓展合计': { col: 23 },
  '美团有人门店': { col: 26 },
  '美团无人点位': { col: 29 },
  '新开门店':   { col: 32 },
  '抖音':       { col: 35 },
  '美团抖音合计': { col: 38 },
  '闲鱼':       { col: 41 },
  '小红书':     { col: 44 },
  '新媒体合计': { col: 47 },
  '续租':       { col: 50 },
  '现有的分销人': { col: 53 },
  '私域推广':   { col: 56 },
  '私域合计':   { col: 59 }
};

// 渠道大类分组
var BLOCK_CONFIG = [
  { name: '站点', icon: '📦', paths: ['端内', '五一地推', '周末地推'], totalPath: '站点合计' },
  { name: '门店', icon: '🏪', paths: ['门店端内', '上翻'], totalPath: '门店合计' },
  { name: '渠道拓展', icon: '🔗', paths: [], totalPath: '渠道拓展合计' },
  { name: '美团抖音', icon: '📱', paths: ['美团有人门店', '美团无人点位', '新开门店', '抖音'], totalPath: '美团抖音合计' },
  { name: '新媒体', icon: '📢', paths: ['闲鱼', '小红书'], totalPath: '新媒体合计' },
  { name: '私域', icon: '🤝', paths: ['续租', '现有的分销人', '私域推广'], totalPath: '私域合计' }
];

// 所有渠道名（用于汇总）
var ALL_CHANNELS = Object.keys(CHANNEL_COLS);

// ========== 工具函数 ==========
function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show ' + type;
  setTimeout(function() { t.className = 'toast'; }, 3000);
}
function loadHistory() { var r = localStorage.getItem(STORAGE_KEY); return r ? JSON.parse(r) : {}; }
function saveHistory(d) { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); }
function clearHistory() { if (!confirm('确定清空所有历史数据？')) return; localStorage.removeItem(STORAGE_KEY); showToast('历史数据已清空', 'info'); renderAll(); }
function numVal(v) { if (v == null || v === '' || v === '—') return null; var n = Number(v); return isNaN(n) ? null : n; }
function rateVal(v) {
  if (v == null || v === '' || v === '—') return null;
  if (typeof v === 'number') return v;
  var s = String(v).replace(/[%％]/g, '').trim();
  if (s === '—' || s === '') return null;
  var n = Number(s);
  if (isNaN(n)) return null;
  return n / 100;
}
function fmtRate(v) { if (v == null) return '-'; return (v * 100).toFixed(1) + '%'; }
function rateClass(rate, timeProg) {
  if (rate == null) return '';
  var r = rate * 100, t = (timeProg || 0) * 100;
  if (r >= t) return 'rate-good';
  if (r >= t * 0.8) return 'rate-warn';
  return 'rate-bad';
}

// ========== 天气数据 ==========
var WEATHER_KEY = 'gmv_may_weather';
function loadWeather() { var r = localStorage.getItem(WEATHER_KEY); return r ? JSON.parse(r) : {}; }
function saveWeather(d) { localStorage.setItem(WEATHER_KEY, JSON.stringify(d)); }
function clearWeather() { if (!confirm('确定清空天气数据？')) return; localStorage.removeItem(WEATHER_KEY); showToast('天气数据已清空', 'info'); renderAll(); }
function uploadWeather() { document.getElementById('weatherInput').click(); }

function weatherIcon(text) {
  if (!text) return '';
  if (/暴雨/.test(text)) return '⛈';
  if (/大雨/.test(text)) return '🌧';
  if (/中雨/.test(text)) return '🌧';
  if (/阵雨/.test(text)) return '🌦';
  if (/小雨/.test(text)) return '🌦';
  if (/雨/.test(text)) return '🌧';
  if (/雾/.test(text)) return '🌫';
  if (/阴/.test(text)) return '☁';
  if (/多云/.test(text)) return '⛅';
  if (/晴/.test(text)) return '☀';
  return '';
}

function getWeatherLabel(city, day) {
  var weather = loadWeather();
  if (city === '总览') return '';
  var w = weather[city];
  if (!w || !w[day]) return '';
  return simplifyWeather(w[day]);
}

// 判断天气是否为雨天
function isRainyWeather(text) {
  if (!text) return false;
  return /雨|雷/.test(text);
}

// 简化天气文字：取好的天气情况
function simplifyWeather(text) {
  if (!text) return '';
  // 如果包含"转"，取好的那种天气
  if (text.indexOf('转') >= 0) {
    var parts = text.split('转');
    // 天气优先级：晴 > 多云 > 阴 > 小雨 > 中雨 > 大雨 > 暴雨
    var priority = ['晴', '多云', '阴', '小雨', '阵雨', '中雨', '大雨', '暴雨', '雷阵雨', '雪'];
    var bestIdx = 999;
    var bestText = parts[0].trim();
    parts.forEach(function(p) {
      var pt = p.trim();
      for (var i = 0; i < priority.length; i++) {
        if (pt.indexOf(priority[i]) >= 0) {
          if (i < bestIdx) { bestIdx = i; bestText = priority[i]; }
          break;
        }
      }
    });
    return bestText;
  }
  // 没有"转"，直接取主要天气词
  var keywords = ['晴', '多云', '阴', '小雨', '阵雨', '中雨', '大雨', '暴雨', '雷阵雨', '雪', '雾'];
  for (var i = 0; i < keywords.length; i++) {
    if (text.indexOf(keywords[i]) >= 0) return keywords[i];
  }
  return text;
}

function getWeatherText(city, day) {
  var weather = loadWeather();
  if (city === '总览') return '';
  var w = weather[city];
  if (!w || !w[day]) return '';
  return w[day];
}

function parseWeatherExcel(buf) {
  var wb = XLSX.read(buf, { type: 'array', cellDates: true });
  var sn = wb.SheetNames[0];
  var rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, defval: null, raw: false });
  if (rows.length < 2) return null;

  // 第一行是表头：空, 武汉, 长沙, 合肥
  var header = rows[0];
  var cityMap = {};
  for (var ci = 1; ci < header.length; ci++) {
    var cName = String(header[ci] || '').trim();
    if (cName) cityMap[ci] = cName;
  }

  var result = {};
  Object.values(cityMap).forEach(function(c) { result[c] = {}; });

  for (var ri = 1; ri < rows.length; ri++) {
    var row = rows[ri];
    if (!row || !row[0]) continue;
    var dateVal = row[0];
    var day = null;

    // 尝试解析日期
    if (typeof dateVal === 'number') {
      // Excel serial number: 基准日1900-01-01=1, 但JS Date epoch不同
      // 用XLSX的日期解析
      var d = new Date((dateVal - 25569) * 86400 * 1000);
      day = d.getDate();
    } else {
      var ds = String(dateVal);
      // 尝试 "4/1" 格式
      var m1 = ds.match(/(\d{1,2})\/(\d{1,2})/);
      if (m1) { day = parseInt(m1[2]); }
      else {
        // 尝试 "2026-05-01" 或 "05-01" 格式
        var m2 = ds.match(/(\d{1,2})-(\d{1,2})$/);
        if (m2) { day = parseInt(m2[2]); }
        else {
          // 尝试日期字符串 "Mon Apr 01 2026..."
          var pd = new Date(ds);
          if (!isNaN(pd.getTime())) { day = pd.getDate(); }
        }
      }
    }

    if (day == null || day < 1 || day > 31) continue;

    Object.keys(cityMap).forEach(function(colIdx) {
      var cName = cityMap[colIdx];
      var wText = row[colIdx];
      if (wText && String(wText).trim()) {
        result[cName][day] = String(wText).trim();
      }
    });
  }

  return result;
}

function handleWeatherFile(file) {
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var result = parseWeatherExcel(e.target.result);
      if (!result) { showToast('天气数据解析失败', 'error'); return; }
      // 合并已有天气数据
      var existing = loadWeather();
      Object.keys(result).forEach(function(city) {
        if (!existing[city]) existing[city] = {};
        Object.keys(result[city]).forEach(function(day) {
          existing[city][day] = result[city][day];
        });
      });
      saveWeather(existing);
      var totalDays = 0;
      Object.keys(result).forEach(function(city) { totalDays = Math.max(totalDays, Object.keys(result[city]).length); });
      showToast('🌤️ 天气数据导入成功！共 ' + totalDays + ' 天', 'success');
      renderAll();
    } catch (err) { showToast('天气解析失败: ' + err.message, 'error'); console.error(err); }
  };
  reader.readAsArrayBuffer(file);
}

// 绑定天气文件上传
document.getElementById('weatherInput').addEventListener('change', function(e) {
  handleWeatherFile(e.target.files[0]);
  e.target.value = '';
});

function exportCSV() {
  var history = loadHistory();
  if (!Object.keys(history).length) { showToast('没有数据可导出', 'error'); return; }
  var cols = ['日期','城市','渠道','累计值','目标','完成率'];
  var csv = '\uFEFF' + cols.join(',') + '\n';
  CITIES.concat(['合计']).forEach(function(city) {
    var cityData = history[city];
    if (!cityData) return;
    Object.keys(cityData).sort().forEach(function(date) {
      var dayData = cityData[date];
      ALL_CHANNELS.forEach(function(ch) {
        var d = dayData[ch];
        if (d) csv += [date, city, ch, d.value||'', d.target||'', d.rate!=null?(d.rate*100).toFixed(1)+'%':''].join(',') + '\n';
      });
    });
  });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = DATA_MONTH + '月GMV历史数据.csv'; a.click(); showToast('CSV已导出', 'success');
}

function downloadHTML() {
  var html = document.documentElement.outerHTML;
  var blob = new Blob(['<!DOCTYPE html>\n' + html], { type: 'text/html;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  var today = new Date();
  var dateStr = today.getFullYear() + String(today.getMonth() + 1).padStart(2, '0') + String(today.getDate()).padStart(2, '0');
  a.download = DATA_MONTH + '月GMV达成率报告_' + dateStr + '.html';
  a.click();
  URL.revokeObjectURL(a.href);
  showToast('页面已下载', 'success');
}

function getYesterday() {
  var now = new Date();
  var y = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1);
  return { day: y.getDate(), month: y.getMonth() + 1, daysInMonth: MAY_DAYS };
}

// ========== Excel解析（读取"达成率看板"sheet） ==========
function parseExcel(buf) {
  var wb = XLSX.read(buf, { type: 'array' });
  // 查找"达成率看板"sheet
  var sheetName = null;
  wb.SheetNames.forEach(function(sn) {
    if (sn.indexOf('达成率看板') >= 0) sheetName = sn;
  });
  if (!sheetName) {
    showToast('未找到"达成率看板"sheet', 'error');
    return null;
  }
  var rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, defval: null });
  var result = {};

  ['武汉', '长沙', '合肥', '合计'].forEach(function(city) {
    var sec = CITY_SECTION[city];
    result[city] = {};
    for (var ri = sec.dataStart - 1; ri <= sec.dataEnd - 1; ri++) {
      var row = rows[ri];
      if (!row) continue;
      var dateStr = row[0];
      if (!dateStr) continue;
      // 日期格式: "5/1" -> "2026-05-01"  (自动识别月份)
      var dateMatch = String(dateStr).match(/^(\d{1,2})\/(\d{1,2})$/);
      if (!dateMatch) continue;
      var month = dateMatch[1].padStart(2, '0');
      var day = dateMatch[2].padStart(2, '0');
      var fullDate = '2026-' + month + '-' + day;
      var timeProg = numVal(row[1]);

      var dayData = { timeProg: timeProg };
      Object.keys(CHANNEL_COLS).forEach(function(ch) {
        var c = CHANNEL_COLS[ch].col;
        var value = numVal(row[c]);
        var target = numVal(row[c + 1]);
        var rate = rateVal(row[c + 2]);
        // 如果有目标和值，用实际值计算达成率
        if (target != null && target > 0 && value != null) {
          rate = value / target;
        }
        dayData[ch] = { value: value, target: target, rate: rate };
      });
      result[city][fullDate] = dayData;
    }
  });
  return result;
}

function mergeData(existing, newData) {
  var merged = JSON.parse(JSON.stringify(existing));
  ['武汉', '长沙', '合肥', '合计'].forEach(function(city) {
    if (!newData[city]) return;
    if (!merged[city]) merged[city] = {};
    Object.keys(newData[city]).forEach(function(date) {
      merged[city][date] = newData[city][date];
    });
  });
  return merged;
}

function handleFile(file) {
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var result = parseExcel(e.target.result);
      if (!result) return;
      var totalDates = 0;
      Object.keys(result).forEach(function(city) { totalDates = Math.max(totalDates, Object.keys(result[city]).length); });
      if (totalDates === 0) { showToast('未识别到有效数据', 'error'); return; }
      saveHistory(mergeData(loadHistory(), result));
      showToast('✅ 导入成功！共 ' + totalDates + ' 天数据', 'success');
      renderAll();
    } catch (err) { showToast('解析失败: ' + err.message, 'error'); console.error(err); }
  };
  reader.readAsArrayBuffer(file);
}

// ========== 拖拽绑定 ==========
document.addEventListener('dragover', function(e) { e.preventDefault(); e.stopPropagation(); }, false);
document.addEventListener('drop', function(e) { e.preventDefault(); e.stopPropagation(); }, false);
var dropZone = document.getElementById('dropZone');
var fileInput = document.getElementById('fileInput');
dropZone.addEventListener('click', function() { fileInput.click(); });
fileInput.addEventListener('change', function(e) { handleFile(e.target.files[0]); fileInput.value = ''; });
dropZone.addEventListener('dragover', function(e) { e.preventDefault(); e.stopPropagation(); dropZone.classList.add('dragover'); }, false);
dropZone.addEventListener('dragleave', function() { dropZone.classList.remove('dragover'); });
dropZone.addEventListener('drop', function(e) {
  e.preventDefault(); e.stopPropagation(); dropZone.classList.remove('dragover');
  var f = e.dataTransfer.files[0];
  if (f && (f.name.endsWith('.xlsx') || f.name.endsWith('.xls'))) handleFile(f);
  else showToast('请拖入 .xlsx 文件', 'error');
}, false);
</script>

<script>
// ========== Tab切换 ==========
var currentTab = 'overview';
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(function(btn) {
    btn.classList.toggle('active', btn.getAttribute('data-tab') === tab);
  });
  document.querySelectorAll('.tab-content').forEach(function(el) {
    el.classList.toggle('active', el.id === 'tab-' + tab);
  });
  setTimeout(function() {
    allCharts.forEach(function(c) { c.resize(); });
    // 重新绘制所有大括号
    redrawAllBrackets();
  }, 100);
}

// 存储每个图表的大括号参数，以便 resize/tab切换时重绘
var bracketConfigs = [];
function redrawAllBrackets() {
  bracketConfigs.forEach(function(cfg) {
    drawBracket(cfg.chart, cfg.timeLineIdx, cfg.timeProgPct, cfg.timeProgStr);
  });
}
function drawBracket(chart, timeLineIdx, timeProgPct, timeProgStr) {
  if (timeLineIdx < 0) return;
  var xCenter = chart.convertToPixel({ xAxisIndex: 0 }, timeLineIdx);
  if (!xCenter || isNaN(xCenter) || xCenter <= 0) return;
  var barHalfW = 14;
  if (timeLineIdx > 0) {
    var xPrev = chart.convertToPixel({ xAxisIndex: 0 }, timeLineIdx - 1);
    if (xPrev && !isNaN(xPrev)) barHalfW = (xCenter - xPrev) * 0.3;
  }
  var bracketX = xCenter + barHalfW + 6;
  var bottomY = chart.convertToPixel({ yAxisIndex: 1 }, 0);
  var topY = chart.convertToPixel({ yAxisIndex: 1 }, timeProgPct);
  if (!bottomY || !topY || isNaN(bottomY) || isNaN(topY) || bottomY <= 0) return;
  var bW = 8;
  var midY = (topY + bottomY) / 2;
  chart.setOption({
    graphic: [{
      type: 'group',
      children: [
        { type: 'line', shape: { x1: bracketX + bW, y1: topY, x2: bracketX, y2: topY }, style: { stroke: '#e84c3d', lineWidth: 2 } },
        { type: 'line', shape: { x1: bracketX, y1: topY, x2: bracketX, y2: midY - 4 }, style: { stroke: '#e84c3d', lineWidth: 2 } },
        { type: 'line', shape: { x1: bracketX, y1: midY - 4, x2: bracketX + bW + 2, y2: midY }, style: { stroke: '#e84c3d', lineWidth: 2 } },
        { type: 'line', shape: { x1: bracketX + bW + 2, y1: midY, x2: bracketX, y2: midY + 4 }, style: { stroke: '#e84c3d', lineWidth: 2 } },
        { type: 'line', shape: { x1: bracketX, y1: midY + 4, x2: bracketX, y2: bottomY }, style: { stroke: '#e84c3d', lineWidth: 2 } },
        { type: 'line', shape: { x1: bracketX + bW, y1: bottomY, x2: bracketX, y2: bottomY }, style: { stroke: '#e84c3d', lineWidth: 2 } },
        { type: 'text', style: { text: '⏱ 时间进度\n' + timeProgStr, x: bracketX + bW + 8, y: midY,
            textAlign: 'left', textVerticalAlign: 'middle', fill: '#e84c3d', fontSize: 11, fontWeight: 'bold', lineHeight: 16 } }
      ]
    }]
  });
}

// ========== 数据准备 ==========
function prepareChartData(history) {
  var result = {};
  var yest = getYesterday();

  // 计算T-1截止日期字符串，只展示到昨天的数据
  var t1Date = DATA_YEAR + '-' + String(DATA_MONTH).padStart(2, '0') + '-' + String(yest.day).padStart(2, '0');
  // 如果当前月份和数据月份不同（比如今天是6/1，数据是5月的），则不截断，展示全部
  var now = new Date();
  var currentMonth = now.getMonth() + 1;
  var currentYear = now.getFullYear();
  var shouldCutoff = (DATA_MONTH === currentMonth && DATA_YEAR === currentYear);

  // 时间进度：如果是当月则用T-1/总天数，如果是过去月份则100%
  var timeProg;
  if (shouldCutoff) {
    timeProg = yest.day / MAY_DAYS;
  } else {
    timeProg = 1; // 月份已过，时间进度100%
  }

  // 处理每个城市（武汉、长沙、合肥）
  CITIES.forEach(function(city) {
    var cityData = history[city];
    if (!cityData) return;
    var dates = Object.keys(cityData).sort();
    // 只保留T-1及之前的数据
    if (shouldCutoff) {
      dates = dates.filter(function(d) { return d <= t1Date; });
    }
    if (!dates.length) return;

    // 计算总GMV（所有大类合计之和 = 站点合计+门店合计+渠道拓展合计+美团抖音合计+新媒体合计+私域合计）
    var totalChannels = ['站点合计', '门店合计', '渠道拓展合计', '美团抖音合计', '新媒体合计', '私域合计'];
    var gmvSeries = [];
    var targetVal = 0;

    dates.forEach(function(d) {
      var dayData = cityData[d];
      var totalGmv = 0, totalTarget = 0, hasData = false;
      totalChannels.forEach(function(ch) {
        var chData = dayData[ch];
        if (chData && chData.value != null) { totalGmv += chData.value; hasData = true; }
        if (chData && chData.target != null) totalTarget += chData.target;
      });
      if (hasData) {
        var totalRate = totalTarget > 0 ? totalGmv / totalTarget : null;
        gmvSeries.push({ date: d, gmv: totalGmv, rate: totalRate, timeProg: dayData.timeProg });
      }
      if (targetVal === 0 && totalTarget > 0) targetVal = totalTarget;
    });

    // 各渠道汇总
    var channelSummary = {};
    var channelDaily = {};
    ALL_CHANNELS.forEach(function(ch) {
      channelDaily[ch] = [];
      dates.forEach(function(d) {
        var chData = cityData[d][ch];
        if (chData) {
          channelDaily[ch].push({ date: d, value: chData.value, target: chData.target, rate: chData.rate });
        }
      });
      // 最新有数据的日期
      var latestData = null;
      for (var i = dates.length - 1; i >= 0; i--) {
        var chd = cityData[dates[i]][ch];
        if (chd && (chd.value != null || chd.target != null)) { latestData = chd; break; }
      }
      if (latestData) {
        channelSummary[ch] = { value: latestData.value, target: latestData.target, rate: latestData.rate };
      }
    });

    var latestGmv = gmvSeries.length > 0 ? gmvSeries[gmvSeries.length - 1] : {};
    result[city] = {
      gmvSeries: gmvSeries,
      targetVal: targetVal,
      totalRate: latestGmv.rate || null,
      timeProg: timeProg,
      latestDate: dates[dates.length - 1],
      channelSummary: channelSummary,
      channelDaily: channelDaily,
      dates: dates
    };
  });

  // ===== 总览：使用"合计"数据 =====
  var hejiData = history['合计'];
  if (hejiData) {
    var hejiDates = Object.keys(hejiData).sort();
    // 只保留T-1及之前的数据
    if (shouldCutoff) {
      hejiDates = hejiDates.filter(function(d) { return d <= t1Date; });
    }
    if (hejiDates.length > 0) {
      var totalChannels = ['站点合计', '门店合计', '渠道拓展合计', '美团抖音合计', '新媒体合计', '私域合计'];
      var overviewGmvSeries = [];
      var overviewTargetVal = 0;

      hejiDates.forEach(function(d) {
        var dayData = hejiData[d];
        var totalGmv = 0, totalTarget = 0, hasData = false;
        totalChannels.forEach(function(ch) {
          var chData = dayData[ch];
          if (chData && chData.value != null) { totalGmv += chData.value; hasData = true; }
          if (chData && chData.target != null) totalTarget += chData.target;
        });
        if (hasData) {
          var totalRate = totalTarget > 0 ? totalGmv / totalTarget : null;
          overviewGmvSeries.push({ date: d, gmv: totalGmv, rate: totalRate, timeProg: dayData.timeProg });
        }
        if (overviewTargetVal === 0 && totalTarget > 0) overviewTargetVal = totalTarget;
      });

      var overviewChannelSummary = {};
      var overviewChannelDaily = {};
      ALL_CHANNELS.forEach(function(ch) {
        overviewChannelDaily[ch] = [];
        hejiDates.forEach(function(d) {
          var chData = hejiData[d][ch];
          if (chData) {
            overviewChannelDaily[ch].push({ date: d, value: chData.value, target: chData.target, rate: chData.rate });
          }
        });
        var latestData = null;
        for (var i = hejiDates.length - 1; i >= 0; i--) {
          var chd = hejiData[hejiDates[i]][ch];
          if (chd && (chd.value != null || chd.target != null)) { latestData = chd; break; }
        }
        if (latestData) {
          overviewChannelSummary[ch] = { value: latestData.value, target: latestData.target, rate: latestData.rate };
        }
      });

      var latestOverview = overviewGmvSeries.length > 0 ? overviewGmvSeries[overviewGmvSeries.length - 1] : {};
      result['总览'] = {
        gmvSeries: overviewGmvSeries,
        targetVal: overviewTargetVal,
        totalRate: latestOverview.rate || null,
        timeProg: timeProg,
        latestDate: hejiDates[hejiDates.length - 1],
        channelSummary: overviewChannelSummary,
        channelDaily: overviewChannelDaily,
        dates: hejiDates
      };
    }
  }

  return result;
}

// ========== 渲染 ==========
var allCharts = [];
function renderAll() {
  allCharts.forEach(function(c) { c.dispose(); });
  allCharts = [];
  bracketConfigs = []; // 清空大括号配置
  var history = loadHistory();

  // 自动检测数据中的月份和天数
  detectMonthFromData(history);

  document.getElementById('tab-overview').innerHTML = '';

  document.getElementById('tab-长沙').innerHTML = '';
  document.getElementById('tab-合肥').innerHTML = '';

  // 统计已有数据天数
  var allDatesSet = {};

  });
  var allDates = Object.keys(allDatesSet).sort();

    : '暂无历史数据';

  // 更新天气状态
  var weather = loadWeather();

  weatherCities.forEach(function(c) { weatherDayCount = Math.max(weatherDayCount, Object.keys(weather[c]).length); });
  document.getElementById('weatherInfo').textContent = weatherDayCount > 0
    ? '🌤️ 已有 ' + weatherDayCount + ' 天天气（' + weatherCities.join('、') + '）'
    : '';

  if (!allDates.length) return;
  var chartData = prepareChartData(history);

  // 渲染总览tab
  if (chartData['总览']) {
    var section = buildCitySection('总览', chartData['总览']);
    document.getElementById('tab-overview').appendChild(section);
    renderCityCharts('总览', chartData['总览']);
  }

  // 渲染各城市tab
  CITIES.forEach(function(city) {
    var d = chartData[city]; if (!d) return;
    var section = buildCitySection(city, d, true);
    document.getElementById('tab-' + city).appendChild(section);
    renderCityCharts(city, d, true);
  });

  window.addEventListener('resize', function() {
    allCharts.forEach(function(c) { c.resize(); });
    setTimeout(redrawAllBrackets, 200);
  });
}

function buildCitySection(city, d, isTab) {
  var suffix = isTab ? '-tab' : '';
  var displayName = city === '总览' ? '三城市合计' : city;
  var totalRateStr = d.totalRate != null ? (d.totalRate * 100).toFixed(1) + '%' : '-';
  var timeProgStr = (d.timeProg * 100).toFixed(1) + '%';
  var latestGMV = d.gmvSeries.length > 0 ? d.gmvSeries[d.gmvSeries.length - 1].gmv : 0;

  // 计算T-1日收入和本月日均
  var t1DailyGMV = 0;
  if (d.gmvSeries.length >= 2) {
    t1DailyGMV = d.gmvSeries[d.gmvSeries.length - 1].gmv - d.gmvSeries[d.gmvSeries.length - 2].gmv;
  } else if (d.gmvSeries.length === 1) {
    t1DailyGMV = d.gmvSeries[0].gmv;
  }
  var monthlyAvg = d.gmvSeries.length > 0 ? latestGMV / d.gmvSeries.length : 0;
  var t1VsAvg = monthlyAvg > 0 ? ((t1DailyGMV - monthlyAvg) / monthlyAvg * 100).toFixed(1) : '0.0';
  var t1VsAvgColor = t1DailyGMV >= monthlyAvg ? '#52c41a' : '#ff4d4f';
  var t1VsAvgSign = t1DailyGMV >= monthlyAvg ? '+' : '';
  var t1AbsDiff = t1DailyGMV - monthlyAvg;
  var t1AbsSign = t1AbsDiff >= 0 ? '+' : '';
  var t1VsAvgLabel = 'T-1日: ¥' + (t1DailyGMV / 10000).toFixed(2) + '万 vs 日均: ¥' + (monthlyAvg / 10000).toFixed(2) + '万';

  // 达成率vs时间进度差值
  var totalRatePct = d.totalRate != null ? (d.totalRate * 100).toFixed(1) : null;
  var timeProgPct = (d.timeProg * 100).toFixed(1);
  var diffVal = totalRatePct != null ? (d.totalRate * 100 - d.timeProg * 100).toFixed(1) : null;
  var diffSign = diffVal != null && diffVal >= 0 ? '+' : '';
  var diffColor = diffVal != null && diffVal >= 0 ? '#52c41a' : '#ff4d4f';
  var diffText = diffVal != null ? diffSign + diffVal + 'pp' : '-';

  var section = document.createElement('div');
  section.className = 'city-section';

    '<div class="kpi-row">' +

    '<div class="kpi-card kpi-green"><div class="label">' + t1VsAvgLabel + '</div><div class="value" style="color:' + t1VsAvgColor + '">' + t1VsAvgSign + t1VsAvg + '%（' + t1AbsSign + (t1AbsDiff / 10000).toFixed(2) + '万）</div></div>' +
    '<div class="kpi-card kpi-blue"><div class="label">达成率 ' + totalRateStr + ' vs 时间进度 ' + timeProgStr + '</div><div class="value" style="color:' + diffColor + '">' + diffText + '</div></div>' +
    '</div>' +
    '<div id="chart1-' + city + suffix + '" class="chart-box"></div>' +
    '<div id="analysis1-' + city + suffix + '"></div>' +
    '<div id="analysis2-' + city + suffix + '"></div>' +
    '<div class="path-block"><h3 class="block-title">📋 全渠道汇总一览</h3><div id="table-consolidated-' + city + suffix + '"></div></div>';

  // 为每个大类板块生成HTML
  BLOCK_CONFIG.forEach(function(block) {
    var blockId = block.name;
    html += '<div class="path-block">' +
      '<h3 class="block-title">' + block.icon + ' ' + block.name + '</h3>' +
      '<div id="table-' + blockId + '-' + city + suffix + '"></div>' +
      '<div id="bigchart-' + blockId + '-' + city + suffix + '" class="chart-box"></div>';
    if (block.paths.length > 0) {
      html += '<div id="pathgrid-' + blockId + '-' + city + suffix + '" class="path-charts-grid"></div>';
    }
    html += '<div id="pathanalysis-' + blockId + '-' + city + suffix + '"></div>' +
      '</div>';
  });

  // 总合计板块
  html += '<div class="path-block">' +
    '<h3 class="block-title">📊 全渠道合计</h3>' +
    '<div id="table-grandtotal-' + city + suffix + '"></div>' +
    '<div id="bigchart-grandtotal-' + city + suffix + '" class="chart-box"></div>' +
    '</div>';

  section.innerHTML = html;
  return section;
}

function renderCityCharts(city, d, isTab) {
  var suffix = isTab ? '-tab' : '';
  var timeProgStr = (d.timeProg * 100).toFixed(1) + '%';

  renderChart1(city, d, timeProgStr, suffix);
  document.getElementById('analysis1-' + city + suffix).innerHTML = generateCityAnalysis(city, d);
  document.getElementById('analysis2-' + city + suffix).innerHTML = generateTableAnalysis(city, d);

  // 渲染全渠道汇总一览表
  renderConsolidatedTable('table-consolidated-' + city + suffix, d);

  // 渲染每个大类板块
  BLOCK_CONFIG.forEach(function(block) {
    var blockId = block.name;
    var tablePaths = [block.totalPath].concat(block.paths);
    renderBlockTable('table-' + blockId + '-' + city + suffix, d, tablePaths);
    renderBigPathChart('bigchart-' + blockId + '-' + city + suffix, d, block.totalPath, timeProgStr, city);
    if (block.paths.length > 0) {
      renderBlockPathCharts('pathgrid-' + blockId + '-' + city + suffix, d, block.paths, timeProgStr, city);
    }
    renderBlockPathAnalysis('pathanalysis-' + blockId + '-' + city + suffix, d, tablePaths);
  });

  // 全渠道合计（用GMV series数据）
  renderGrandTotalTable('table-grandtotal-' + city + suffix, d);
  renderGrandTotalChart('bigchart-grandtotal-' + city + suffix, d, timeProgStr, city);
}

<script>
// ========== 图1：总GMV柱状图 + 达成率折线 + 每日营收子图 ==========
function renderChart1(city, d, timeProgStr, suffix) {
  suffix = suffix || '';
  var displayName = city === '总览' ? '三城市合计' : city;
  var dom = document.getElementById('chart1-' + city + suffix);
  var chart = echarts.init(dom);
  allCharts.push(chart);

  var dataMap = {};
  d.gmvSeries.forEach(function(x) { dataMap[x.date] = x; });
  var allDates = generateAllDates();
  var dateLabels = allDates.map(function(x) { return x.substring(5); });

// ========== 分板块表格 ==========

    var currentStr = p.value != null ? '¥' + (p.value / 10000).toFixed(2) + '万' : '-';

<script>
// ========== 分析文字生成 ==========
function generateCityAnalysis(city, d) {
  if (!d || !d.gmvSeries.length) return '';
  var displayName = city === '总览' ? '三城市合计' : city;
  var latest = d.gmvSeries[d.gmvSeries.length - 1];
  var latestGMV = latest.gmv;
  var totalRate = d.totalRate;
  var timeProg = d.timeProg;
  var targetVal = d.targetVal || 0;
  var timeProgPct = (timeProg * 100).toFixed(1);
  var totalRatePct = totalRate != null ? (totalRate * 100).toFixed(1) : null;
  var gap = targetVal - latestGMV;
  var yest = getYesterday();
  var remainDays = MAY_DAYS - yest.day;
  var dailyNeeded = remainDays > 0 ? gap / remainDays : 0;

  var recentGrowths = [];
  for (var i = d.gmvSeries.length - 1; i >= 1 && recentGrowths.length < 3; i--) {
    var prev = d.gmvSeries[i - 1].gmv;
    var curr = d.gmvSeries[i].gmv;
    if (prev != null && curr != null && prev > 0) {
      recentGrowths.push(curr - prev);
    }
  }
  var avgDailyGrowth = recentGrowths.length > 0 ? recentGrowths.reduce(function(a, b) { return a + b; }, 0) / recentGrowths.length : 0;

  var html = '<div class="analysis-box">';
  html += '<div class="analysis-title">📝 ' + displayName + ' GMV整体分析</div>';
  html += '<ul>';

  if (totalRatePct != null) {
    var diff = (totalRate - timeProg) * 100;
    if (diff >= 0) {
      html += '<li>截至最新数据日，' + displayName + '累计GMV为 <span class="highlight-info">¥' + (latestGMV / 10000).toFixed(2) + '万</span>，达成率 <span class="highlight-good">' + totalRatePct + '%</span>，<span class="highlight-good">领先</span>时间进度（' + timeProgPct + '%）<span class="highlight-good">' + diff.toFixed(1) + '个百分点</span>，整体节奏良好。</li>';
    } else {
      html += '<li>截至最新数据日，' + displayName + '累计GMV为 <span class="highlight-info">¥' + (latestGMV / 10000).toFixed(2) + '万</span>，达成率 <span class="highlight-bad">' + totalRatePct + '%</span>，<span class="highlight-bad">落后</span>时间进度（' + timeProgPct + '%）<span class="highlight-bad">' + Math.abs(diff).toFixed(1) + '个百分点</span>，需加快推进。</li>';
    }
  }

  if (targetVal > 0 && gap > 0) {
    html += '<li>距目标（¥' + (targetVal / 10000).toFixed(2) + '万）还差 <span class="highlight-warn">¥' + (gap / 10000).toFixed(2) + '万</span>，剩余 ' + remainDays + ' 天，日均需完成 <span class="highlight-warn">¥' + (dailyNeeded / 10000).toFixed(2) + '万</span>。</li>';
  } else if (gap <= 0) {
    html += '<li>🎉 已达成目标（¥' + (targetVal / 10000).toFixed(2) + '万），超额完成 <span class="highlight-good">¥' + (Math.abs(gap) / 10000).toFixed(2) + '万</span>。</li>';
  }

  if (avgDailyGrowth > 0) {
    html += '<li>近期日均增长约 <span class="highlight-info">¥' + (avgDailyGrowth / 10000).toFixed(2) + '万</span>';
    if (gap > 0 && remainDays > 0) {
      if (avgDailyGrowth >= dailyNeeded) {
        html += '，按当前增速<span class="highlight-good">有望达成目标</span>。';
      } else {
        var shortfall = ((dailyNeeded - avgDailyGrowth) / 10000).toFixed(2);
        html += '，距所需日均增速还差 <span class="highlight-bad">¥' + shortfall + '万/天</span>，需提升增长动力。';
      }
    }
    html += '</li>';
  }

  html += '</ul></div>';
  return html;
}

function generateTableAnalysis(city, d) {
  if (!d || !Object.keys(d.channelSummary).length) return '';
  var displayName = city === '总览' ? '三城市合计' : city;
  var timeProg = d.timeProg;

  // 分析各大类合计的达成情况
  var totalChannels = ['站点合计', '门店合计', '渠道拓展合计', '美团抖音合计', '新媒体合计', '私域合计'];
  var good = [], warn = [], bad = [], noData = [];

  totalChannels.forEach(function(ch) {
    var s = d.channelSummary[ch];
    if (!s || s.rate == null) { noData.push(ch); return; }
    var ratePct = s.rate * 100;
    var timeProgPct = timeProg * 100;
    if (ratePct >= timeProgPct) good.push({ name: ch, rate: s.rate });
    else if (ratePct >= timeProgPct * 0.8) warn.push({ name: ch, rate: s.rate });
    else bad.push({ name: ch, rate: s.rate });
  });

  var html = '<div class="analysis-box">';
  html += '<div class="analysis-title">📊 ' + displayName + ' 各大类达成情况分析</div>';
  html += '<ul>';

  if (good.length > 0) {
    html += '<li><span class="highlight-good">表现优秀（达成率≥时间进度）：</span>' + good.map(function(p) {
      return p.name + '（' + (p.rate * 100).toFixed(1) + '%）';
    }).join('、') + '。';
    var best = good.reduce(function(a, b) { return (a.rate || 0) > (b.rate || 0) ? a : b; });
    html += '其中 <span class="highlight-good">' + best.name + '</span> 达成率最高。</li>';
  }

  if (warn.length > 0) {
    html += '<li><span class="highlight-warn">需关注（达成率接近时间进度）：</span>' + warn.map(function(p) {
      return p.name + '（' + (p.rate * 100).toFixed(1) + '%）';
    }).join('、') + '，建议加大投入力度。</li>';
  }

  if (bad.length > 0) {
    html += '<li><span class="highlight-bad">明显落后（达成率远低于时间进度）：</span>' + bad.map(function(p) {
      return p.name + '（' + (p.rate * 100).toFixed(1) + '%）';
    }).join('、') + '，需重点关注并制定追赶计划。</li>';
  }

  if (noData.length > 0) {
    html += '<li>暂无数据或目标为0的大类：' + noData.join('、') + '。</li>';
  }

  // 站点 vs 线上对比
  var zhandian = d.channelSummary['站点合计'];
  var meituan = d.channelSummary['美团抖音合计'];
  if (zhandian && meituan && zhandian.rate != null && meituan.rate != null) {
    if (zhandian.rate > meituan.rate) {
      html += '<li>站点达成率（' + (zhandian.rate * 100).toFixed(1) + '%）<span class="highlight-good">高于</span>美团抖音（' + (meituan.rate * 100).toFixed(1) + '%），站点渠道表现更强。</li>';
    } else {
      html += '<li>美团抖音达成率（' + (meituan.rate * 100).toFixed(1) + '%）<span class="highlight-good">高于</span>站点（' + (zhandian.rate * 100).toFixed(1) + '%），线上渠道表现更强。</li>';
    }
  }

  html += '</ul></div>';
  return html;
}

function generatePathAnalysis(ch, pData, timeProg) {
  if (!pData || pData.length < 2) return '';
  var latest = pData[pData.length - 1];
  if (latest.value == null) return '';

  var ratePct = latest.rate != null ? (latest.rate * 100).toFixed(1) : null;
  var timeProgPct = (timeProg * 100).toFixed(1);

  var recentGrowths = [];
  for (var i = pData.length - 1; i >= 1 && recentGrowths.length < 3; i--) {
    if (pData[i].value != null && pData[i - 1].value != null) {
      recentGrowths.push(pData[i].value - pData[i - 1].value);
    }
  }
  var avgGrowth = recentGrowths.length > 0 ? recentGrowths.reduce(function(a, b) { return a + b; }, 0) / recentGrowths.length : 0;

  var html = '<div class="path-analysis-box">';
  html += '📌 <b>' + ch + '</b>：';

  if (ratePct != null) {
    var diff = latest.rate - timeProg;
    if (diff >= 0) {
      html += '达成率 <span style="color:#52c41a;font-weight:bold">' + ratePct + '%</span>，领先时间进度 ' + (diff * 100).toFixed(1) + ' 个百分点。';
    } else {
      html += '达成率 <span style="color:#ff4d4f;font-weight:bold">' + ratePct + '%</span>，落后时间进度 ' + Math.abs(diff * 100).toFixed(1) + ' 个百分点。';
    }
  }

  html += '累计收入 ¥' + (latest.value / 10000).toFixed(2) + '万';
  if (latest.target) {
    var remaining = latest.target - latest.value;
    if (remaining > 0) {
      html += '，距目标还差 ¥' + (remaining / 10000).toFixed(2) + '万';
    } else {
      html += '，已超额完成目标';
    }
  }
  html += '。';

  if (avgGrowth > 0) {
    html += '近期日均增长约 ¥' + (avgGrowth / 10000).toFixed(2) + '万。';
  }

  html += '</div>';
  return html;
}
